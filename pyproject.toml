[project]
name = "lendrag"
version = "0.1.0"
description = "Lending policy assistant: hybrid-search RAG with citations and an evaluation suite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "qdrant-client>=1.12",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
lendrag-ingest = "lendrag.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lendrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
