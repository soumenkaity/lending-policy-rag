<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lending Policy Assistant</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#1d1d1b; --muted:#6b6b66; --line:#e3e3de; --accent:#0f6e56; --cite:#e6f2ee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151514; --card:#1f1f1d; --text:#ececea; --muted:#9a9a94; --line:#33332f; --accent:#4fc39f; --cite:#1d3530; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form { display:flex; gap:8px; }
  input { flex:1; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); font:inherit; }
  button { padding:12px 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .examples { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 24px; }
  .examples button { background:transparent; color:var(--muted); border:1px solid var(--line); font-weight:400; font-size:.85rem; padding:6px 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  .meta { color:var(--muted); font-size:.85rem; margin-top:8px; }
  details { border-top:1px solid var(--line); padding:10px 0; }
  summary { cursor:pointer; font-size:.92rem; }
  .cited summary { font-weight:600; }
  .tag { display:inline-block; background:var(--cite); color:var(--accent); border-radius:6px; padding:0 6px; font-size:.75rem; margin-left:6px; }
  details p { color:var(--muted); font-size:.9rem; margin:8px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Lending Policy Assistant</h1>
  <p class="sub">Answers come only from Northwind Credit's policy documents, with citations.</p>
  <form id="f">
    <input id="q" placeholder="e.g. What happens if a disbursement fails?" autocomplete="off" required minlength="3">
    <button id="b">Ask</button>
  </form>
  <div class="examples" id="ex"></div>
  <div id="out"></div>
</main>
<script>
const examples = ["What is the minimum credit score?", "Can I foreclose my loan early?",
  "How much of an invoice can supplier financing cover?", "Do you offer home loans?"];
const ex = document.getElementById("ex"), q = document.getElementById("q"), b = document.getElementById("b"), out = document.getElementById("out");
examples.forEach(t => { const e = document.createElement("button"); e.type = "button"; e.textContent = t;
  e.onclick = () => { q.value = t; ask(); }; ex.appendChild(e); });
document.getElementById("f").onsubmit = ev => { ev.preventDefault(); ask(); };
function el(tag, text, cls) { const e = document.createElement(tag); if (text) e.textContent = text; if (cls) e.className = cls; return e; }
async function ask() {
  b.disabled = true; out.replaceChildren(el("p", "Thinking…", "meta"));
  try {
    const r = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q.value }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    const card = el("div", null, "card");
    card.appendChild(el("div", data.answer));
    card.appendChild(el("div", `${data.latency_ms} ms`, "meta"));
    const src = el("div", null, "card");
    src.appendChild(el("strong", "Retrieved sources"));
    data.sources.forEach(s => {
      const d = el("details", null, s.cited ? "cited" : ""); const sm = el("summary", `[${s.number}] ${s.document} › ${s.section}`);
      if (s.cited) sm.appendChild(el("span", "cited", "tag"));
      d.appendChild(sm); d.appendChild(el("p", s.text)); src.appendChild(d);
    });
    out.replaceChildren(card, src);
  } catch (e) { out.replaceChildren(el("p", "Error: " + e.message, "meta")); }
  finally { b.disabled = false; }
}
</script>
</body>
</html>
